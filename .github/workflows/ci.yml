name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -r portal/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Repository consistency (registry, generated files, nothing forbidden tracked)
        run: python portal/scripts/check_repo.py

      - name: Tests
        # Tests that need cl.exe 13.10.3052 or the game files skip themselves here; maintainers run
        # them locally (python -m pytest -q portal/tests) and re-verify with portal/scripts/reverify_all.py.
        run: python -m pytest -q portal/tests
